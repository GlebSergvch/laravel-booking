version: "3.9"

services:

  nginx:
    build:
      context: .
      dockerfile: .docker/nginx/Dockerfile
    container_name: "${APP_ENV}_${CONTAINER_NAME}_nginx"
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - "./.docker/nginx/conf/${APP_ENV}/backend.conf:/etc/nginx/conf.d/x_backend.conf"
      - ./runtime/nginx:/var/log/nginx
      - ./backend:/var/www/backend
    depends_on:
      - php
    entrypoint: ["nginx-debug", "-g", "daemon off;"]
    networks:
      - booking

  php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      args:
        - WITH_XDEBUG=true
        - APP_ENV=${APP_ENV}
    container_name: "${APP_ENV}_${CONTAINER_NAME}_php"
    restart: unless-stopped
    environment:
      XDEBUG_CONFIG: "remote_host=192.168.220.1 remote_enable=1"
      PHP_IDE_CONFIG: "serverName=Docker"
      PHP_ENABLE_XDEBUG: 1
      PGPASSFILE: "/var/local/.pgpass"
    depends_on:
      - postgresql
    volumes:
      - ./backend:/var/www/backend
      - "./.docker/php/ini/php-dev.ini:/usr/local/etc/php/conf.d/xx-custom.ini"
    ports:
      - "8080:8080"
    networks:
      - booking

  postgresql:
    hostname: ${DB_HOST}
    container_name: "${APP_ENV}_${CONTAINER_NAME}_postgres"
    restart: unless-stopped
    build:
      context: ./.docker/postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
      PGDATA: "/var/lib/postgresql/data/pgdata"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 4G
    ports:
      - "${DB_PORT}:5432"
    networks:
      - booking
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    build:
      context: ./.docker/redis
    container_name: "${APP_ENV}_${CONTAINER_NAME}_redis"
    hostname: ${REDIS_HOST}
    restart: unless-stopped
    volumes:
      - "./.docker/redis/redis.conf:/usr/local/etc/redis/redis.conf"
    command: "redis-server /usr/local/etc/redis/redis.conf"
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - booking

  vue:
    container_name: "${APP_ENV}_${CONTAINER_NAME}_vue"
    tty: true
    build:
      context: ./.docker/vue
    volumes:
      - ./frontend:/var/www/frontend:rw
    ports:
      - "${NUXT_PORT}:3000"
      - "24678:24678"
    tmpfs: /tmp
    networks:
      - booking

  zookeeper:
    image: confluentinc/cp-zookeeper:6.2.1
    container_name: "${APP_ENV}_${CONTAINER_NAME}_zookeeper"
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - booking

  kafka:
    image: confluentinc/cp-kafka:6.2.1
    container_name: "${APP_ENV}_${CONTAINER_NAME}_kafka"
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - booking

  # Опционально: Confluent Control Center для UI-мониторинга (можно убрать для простоты)
  control-center:
    image: confluentinc/cp-enterprise-control-center:latest
    container_name: "${APP_ENV}_${CONTAINER_NAME}_control_center"
    restart: unless-stopped
    depends_on:
      - kafka
      - zookeeper
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: kafka:9092
      CONTROL_CENTER_REPLICATION_FACTOR: 1
    ports:
      - "9021:9021"
    networks:
      - booking

  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: "${APP_ENV}_${CONTAINER_NAME}_rabbit"
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      # при желании добавьте RABBITMQ_DEFAULT_VHOST: my_vhost
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    networks:
      - booking
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  pgdata:
    driver: local
  pgdata_test:
    driver: local
  vue-app:
    driver: local
  rabbitmq-data:
    driver: local

networks:
  booking:
    driver: bridge

